name: ci

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the volta.node pin, so the version lives in one place.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # .npmrc sets ignore-scripts, so the browser download that
      # normally rides along with the install never runs.
      #
      # --only-shell skips the headed Chromium build, which install
      # otherwise fetches alongside the headless shell. Safe while no
      # test sets `channel` or runs headed; note the shell renders
      # screenshots differently, so visual comparison against a headed
      # local run would not match.
      - run: npx playwright install --with-deps --only-shell chromium

      - run: npm run verify

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
