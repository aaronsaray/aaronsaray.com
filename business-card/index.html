<!-- Printed by build.ts (make card), opened in a browser to iterate. Reads the site fonts by relative path, so it must stay one directory below the repo root. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Business card</title>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400 900;
        src: url("../public/fonts/inter-latin-variable.woff2") format("woff2");
      }

      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 400 700;
        src: url("../public/fonts/fraunces-latin-variable.woff2")
          format("woff2");
      }

      /* MOO's bleed size is 3.66 x 2.16in, which is 263.52 x 155.52pt.
         Chromium rounds a PDF page box to whole points and emits
         264 x 156pt; 352 x 208px is that size exactly, so the painted
         card fills the page box. Trim is 3.5 x 2in (336 x 192px), 8px in
         from every edge. The safe area is 3.34 x 1.84in, 15.68px in. */
      @page {
        size: 352px 208px;
        margin: 0;
      }

      html {
        print-color-adjust: exact;
      }

      body {
        margin: 0;
      }

      @media screen {
        body {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 24px;
          padding: 24px;
          background: #3a3f46;
        }
      }

      /* #0a0a0a and #8e959e mirror --color-night and --color-ink-dim in
         src/styles/global.css. */
      .side {
        position: relative;
        box-sizing: border-box;
        width: 352px;
        height: 208px;
        overflow: hidden;
        background: #0a0a0a;
        color: #8e959e;
        font-family: "Inter", sans-serif;
      }

      [data-side="front"] .back,
      [data-side="back"] .front {
        display: none;
      }

      .front {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* The logo's fills are its --logo-a and --logo-s custom properties,
         set here: the site's accent and ink pulled down in value, the S
         kept the brighter of the two as on the site. The seam is a
         bright paper insert, so the face stays dark. */
      .front svg {
        height: 42px;
        width: auto;
        overflow: visible;
        --logo-a: #2f4f6b;
        --logo-s: #7b838c;
      }

      /* 54px bottom: the name sits halfway between the card's center
         and the center of the space above the bottom line. */
      .back {
        display: grid;
        place-items: center;
        padding: 32px 32px 54px;
      }

      .name {
        margin: 0;
        color: #fff;
        font-family: "Fraunces", serif;
        font-size: 29pt;
        font-weight: 600;
        font-variation-settings: "opsz" 29;
        line-height: 1;
      }

      .line {
        position: absolute;
        inset: auto 32px 32px;
        margin: 0;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 9.5pt;
        font-weight: 500;
        line-height: 1;
      }

      .guide {
        position: absolute;
        pointer-events: none;
        border: 1px dashed rgb(255 255 255 / 0.35);
      }

      .guide-trim {
        inset: 8px;
        border-radius: 5mm;
      }

      .guide-safe {
        inset: 15.68px;
      }

      @media print {
        .guide {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <section class="side front">

    <section class="side back">
      <p class="name">Aaron Saray</p>
      <p class="line">
        <span>I make things better</span>
        <span>aaronsaray.com</span>
      </p>
      <div class="guide guide-trim"></div>
      <div class="guide guide-safe"></div>
    </section>
  </body>
</html>
