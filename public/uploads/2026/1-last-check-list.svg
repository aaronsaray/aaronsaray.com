<!-- Space Grotesk is embedded as a subset: Basic Latin plus ’ ≠ ↓. Any other character falls back to a system font. -->
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="154" viewBox="0 0 260 154">
  <style>
    @font-face {
      font-family: "Space Grotesk";
      font-weight: 300 700;
      src: url("data:font/woff2;base64,") format("woff2");
    }
    text { font-family: "Space Grotesk", system-ui, sans-serif; }
    .title { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; fill: #e2e8f0; }
    .title tspan { fill: #ff475a; }
    .summary { font-size: 15px; font-weight: 500; fill: #e2e8f0; }
    .button { fill: #ff475a; }
    .label { font-size: 12.5px; font-weight: 700; fill: #0b0b0b; text-anchor: middle; }
  </style>
  <rect width="260" height="154" fill="#0b1020"/>
  <circle cx="26.2" cy="29.5" r="5.2" fill="none" stroke="#ff475a" stroke-width="2"/>
  <text class="title" x="40" y="34">1 LAST CHECK <tspan>LIST</tspan></text>
  <text class="summary" x="20" y="64">10 points to pressure-test</text>
  <text class="summary" x="20" y="84">your plan before you commit.</text>
  <rect class="button" x="20" y="102" width="220" height="32" rx="8"/>
  <text class="label" x="130" y="122.5">Download the PDF ↓</text>
</svg>
